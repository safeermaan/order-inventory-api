name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
      TEST_DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run openapi
      - run: git diff --exit-code -- openapi/openapi.json
      - run: npm test
      - run: docker build -t order-inventory-api .
